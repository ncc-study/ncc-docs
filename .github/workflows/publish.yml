name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # ── Enable these two steps if any chapter contains an executable
      # ```{r} chunk. Note: `eval: false` is NOT enough to avoid this —
      # Quarto still starts the knitr engine, which needs R + knitr.
      # For illustrative-only code, use a plain ```r block instead.
      # - name: Set up R
      #   uses: r-lib/actions/setup-r@v2
      #   with:
      #     use-public-rspm: true
      # - name: Install R dependencies
      #   uses: r-lib/actions/setup-renv@v2   # requires an renv.lock in the repo

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
