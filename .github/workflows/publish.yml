name: Publish

on:
  push:
    branches: [main]
  # Weekly rebuild so the Google Scholar metrics on the landing page stay current.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # ── Enable these two steps if any chapter contains an executable
      # ```{r} chunk. Note: `eval: false` is NOT enough to avoid this —
      # Quarto still starts the knitr engine, which needs R + knitr.
      # For illustrative-only code, use a plain ```r block instead.
      # - name: Set up R
      #   uses: r-lib/actions/setup-r@v2
      #   with:
      #     use-public-rspm: true
      # - name: Install R dependencies
      #   uses: r-lib/actions/setup-renv@v2   # requires an renv.lock in the repo

      # Refresh the landing-page bibliometrics for this build only (nothing
      # is committed). Google Scholar often blocks CI runners; on failure the
      # committed _scholar-metrics.md is used and the build carries on.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Google Scholar metrics
        continue-on-error: true
        timeout-minutes: 5
        run: |
          pip install -r scripts/requirements.txt
          python scripts/fetch_scholar_metrics.py SLJhEk0AAAAJ
          # Keep the working tree clean for the publish step.
          git update-index --skip-worktree _scholar-metrics.md

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
